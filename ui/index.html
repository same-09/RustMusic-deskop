<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustMusic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>

  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></symbol>
  <symbol id="i-eq" viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".6"/><circle cx="17.5" cy="10.5" r=".6"/><circle cx="8.5" cy="7.5" r=".6"/><circle cx="6.5" cy="12.5" r=".6"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-home-f" viewBox="0 0 24 24"><path d="M12 2.7 3.1 10.1a1.2 1.2 0 0 0-.43.92V20a1.8 1.8 0 0 0 1.8 1.8H9.2v-6a1 1 0 0 1 1-1h3.6a1 1 0 0 1 1 1v6h4.73a1.8 1.8 0 0 0 1.8-1.8v-8.98a1.2 1.2 0 0 0-.43-.92z"/></symbol>
  <symbol id="i-search-f" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.4" fill="none" stroke-width="3.2"/><circle cx="10.5" cy="10.5" r="2.2" fill="currentColor" stroke="none"/><path d="m15.4 15.4 5.2 5.2" fill="none" stroke-width="3.4"/></symbol>
  <symbol id="i-library-f" viewBox="0 0 24 24"><path d="M5.2 4.2A1.7 1.7 0 0 1 6.9 2.5h6.2a1.7 1.7 0 0 1 1.7 1.7V21l-4.8-3.3L5.2 21z"/><path d="M17.2 5.3h.1a1.7 1.7 0 0 1 1.7 1.7v12.6l-1.8-1.2z"/></symbol>
  <symbol id="i-gear-f" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.2l1.7 2.7 3.1-.7.9 3 3 .9-.7 3.1 2.7 1.7-2.7 1.7.7 3.1-3 .9-.9 3-3.1-.7L12 21.8l-1.7-2.7-3.1.7-.9-3-3-.9.7-3.1L2.3 11l2.7-1.7-.7-3.1 3-.9.9-3 3.1.7zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" /><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M15 4v16"/></symbol>
  <symbol id="i-qadd" viewBox="0 0 24 24"><path d="M3 6h12"/><path d="M3 12h8"/><path d="M3 18h8"/><path d="M18 12v8"/><path d="M14 16h8"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</svg>

<div id="backdrop"></div>
<div id="drag" data-tauri-drag-region></div>
<div id="winctl" role="group" aria-label="Kontrol jendela">
  <button id="w-min" title="Perkecil" aria-label="Perkecil"><svg viewBox="0 0 14 14"><path d="M2 7H12"/></svg></button>
  <button id="w-max" title="Perbesar" aria-label="Perbesar">
    <svg class="mx" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" rx="2"/></svg>
    <svg class="rs" viewBox="0 0 14 14"><rect x="2" y="4.25" width="7.75" height="7.75" rx="1.75"/><path d="M4.5 2H10.25C11.22 2 12 2.78 12 3.75V9.5"/></svg>
  </button>
  <button id="w-close" title="Tutup" aria-label="Tutup"><svg viewBox="0 0 14 14"><path d="M2.5 2.5L11.5 11.5M11.5 2.5L2.5 11.5"/></svg></button>
</div>
<div id="app">
  <aside id="side">
    <div class="panel">
      <button class="brand" data-go="beranda" title="RustMusic" aria-label="RustMusic"><i></i></button>
      <nav>
        <button data-go="beranda" title="Beranda" aria-label="Beranda"><svg class="i nav-i"><use href="#i-home-f"/></svg></button>
        <button data-go="cari" title="Cari" aria-label="Cari"><svg class="i nav-i"><use href="#i-search-f"/></svg></button>
        <button data-go="pustaka" title="Pustaka" aria-label="Pustaka"><svg class="i nav-i"><use href="#i-library-f"/></svg></button>
      </nav>
      <div class="sep" id="side-sep" hidden></div>
      <div class="slib" id="side-lib"></div>
    </div>
    <button class="gear" data-go="kamu" title="Kamu dan pengaturan" aria-label="Kamu dan pengaturan"><svg class="i nav-i"><use href="#i-gear-f"/></svg></button>
  </aside>

  <section id="main">
    <button id="back" class="glassbtn" title="Kembali" aria-label="Kembali" hidden><svg class="i"><use href="#i-back"/></svg></button>
    <div id="view" tabindex="-1"></div>
  </section>

  <footer id="bar">
    <div class="seekline"><input id="seek" class="rng" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu"></div>
    <div class="bl">
      <button class="np" id="open-full" title="Buka layar penuh">
        <span class="cov"><img id="bar-cover" alt="" hidden><span id="bar-ph" class="ph"></span></span>
        <span class="meta"><b id="bar-title">Belum ada lagu</b><small id="bar-artist">Pilih lagu untuk mulai</small></span>
      </button>
      <button class="ibtn" id="bar-like" title="Suka"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="bc">
      <button class="ibtn" id="prev" title="Sebelumnya"><svg class="i fill"><use href="#i-prev"/></svg></button>
      <button class="play" id="toggle" title="Putar / jeda (Spasi)"><svg class="i fill"><use href="#i-play"/></svg></button>
      <button class="ibtn" id="next" title="Berikutnya"><svg class="i fill"><use href="#i-next"/></svg></button>
    </div>
    <div class="br">
      <div class="toolbox">
        <button class="ibtn" id="shuffle" title="Acak"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="ibtn" id="repeat" title="Ulang"><svg class="i"><use href="#i-repeat"/></svg></button>
        <span class="vsep"></span>
        <div class="volwrap">
          <button class="ibtn" id="mute" title="Volume"><svg class="i"><use href="#i-volume"/></svg></button>
          <div class="volpop"><input id="vol" class="rng" type="range" min="0" max="100" value="80" aria-label="Volume"></div>
        </div>
        <span class="vsep"></span>
        <button class="ibtn" id="open-queue" title="Antrean"><svg class="i"><use href="#i-panel"/></svg></button>
      </div>
    </div>
  </footer>

  <aside id="panel" hidden>
    <div class="phead"><b>Antrean</b><button class="ibtn" id="close-panel" title="Tutup"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="pbody" id="panel-body"></div>
  </aside>

  <section id="full" hidden aria-label="Sedang diputar">
    <div class="fbg" id="fbg"></div><div class="fshade"></div>
    <div class="ftabs" role="tablist"><button id="tab-lirik" class="on" role="tab">Lirik</button><button id="tab-antrean" role="tab">Antrean</button></div>
    <button class="glassbtn" id="close-full" title="Tutup" aria-label="Tutup"><svg class="i"><use href="#i-chev-down"/></svg></button>
    <div class="fgrid">
      <div class="fleft">
        <div class="fcover" id="f-cover"></div>
        <div class="finfo">
          <div class="ft"><b id="f-title">Belum ada lagu</b><span id="f-artist"></span></div>
          <button class="fheart" id="f-like" title="Suka"><svg class="i"><use href="#i-heart"/></svg></button>
        </div>
        <div class="ftime"><input id="fseek" class="rng thick" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu"><div><time id="f-now">0:00</time><time id="f-all">0:00</time></div></div>
        <div class="fctl">
          <button class="ibtn" id="f-shuffle" title="Acak"><svg class="i"><use href="#i-shuffle"/></svg></button>
          <button class="ibtn" id="f-prev" title="Sebelumnya"><svg class="i fill"><use href="#i-prev"/></svg></button>
          <button class="fplay" id="f-toggle" title="Putar / jeda"><svg class="i fill"><use href="#i-play"/></svg></button>
          <button class="ibtn" id="f-next" title="Berikutnya"><svg class="i fill"><use href="#i-next"/></svg></button>
          <button class="ibtn" id="f-repeat" title="Ulang"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="fvol"><button class="ibtn" id="f-mute" title="Bisukan"><svg class="i"><use href="#i-volume"/></svg></button><input id="fvol" class="rng" type="range" min="0" max="100" value="80" aria-label="Volume"></div>
      </div>
      <div class="fright"><div class="fq" id="f-lyrics"></div><div class="fq" id="f-queue" hidden></div></div>
    </div>
  </section>
  <div id="toast" role="status"></div>
</div>
<div id="setup" role="alertdialog" aria-live="polite" aria-labelledby="setup-title" hidden>
  <div class="card">
    <img src="logo/app.png" alt="" width="72" height="72">
    <h1 id="setup-title">Menyiapkan RustMusic</h1>
    <p id="setup-msg">Memeriksa yt-dlp...</p>
    <div class="dotw"><div id="setup-dots"></div></div>
    <div class="acts">
      <button id="setup-retry" class="primary" hidden>Coba lagi</button>
      <button id="setup-skip" hidden>Lewati</button>
    </div>
  </div>
</div>
<div id="install" role="dialog" aria-labelledby="install-title" hidden>
  <div class="card">
    <img src="logo/app.png" alt="" width="72" height="72">
    <h1 id="install-title">Setup RustMusic</h1>
    <p id="install-msg">Pasang RustMusic di komputer ini dan buat shortcut.</p>
    <div class="dotw" id="install-track" hidden><div id="install-dots"></div></div>
    <div class="acts">
      <button id="install-go" class="primary">Setup</button>
      <button id="install-skip">Jalankan tanpa pasang</button>
    </div>
  </div>
</div>
<div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
  <div class="box">
    <h2 id="dlg-title">Playlist baru</h2>
    <label class="field"><input id="dlg-input" maxlength="60" placeholder="Nama playlist" autocomplete="off" spellcheck="false"></label>
    <div class="acts"><button id="dlg-cancel" class="btn soft">Batal</button><button id="dlg-ok" class="btn">Buat</button></div>
  </div>
</div>
<div id="update" role="dialog" aria-labelledby="update-title" hidden>
  <div class="card">
    <img src="logo/app.png" alt="" width="72" height="72">
    <h1 id="update-title">Update tersedia</h1>
    <p id="update-msg"></p>
    <pre id="update-notes" hidden></pre>
    <div class="dotw" id="update-wrap" hidden><div id="update-dots"></div></div>
    <div class="acts">
      <button id="update-go" class="primary">Update sekarang</button>
      <button id="update-later">Nanti</button>
    </div>
  </div>
</div>
<input type="file" id="files" multiple accept="audio/*" hidden>
<script src="app.js"></script>
</body>
</html>
